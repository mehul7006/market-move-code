# Generated by share.py - nginx reverse proxy for the Market Signal Desk.
# Run:  nginx -p <nginx prefix> -c "C:/Users/Hada/Documents/Qoder/2026-11-05/f59e2388/market-dashboard/nginx/market-desk.conf"
worker_processes 1;
error_log C:/Users/Hada/Documents/Qoder/2026-11-05/f59e2388/market-dashboard/nginx/logs/error.log warn;
events { worker_connections 1024; }

http {
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    access_log "C:/Users/Hada/Documents/Qoder/2026-11-05/f59e2388/market-dashboard/nginx/logs/access.log";

    upstream market_desk {
        server 127.0.0.1:8787;
        keepalive 8;
    }

    server {
        listen 8899;
        server_name _;
        client_max_body_size 1m;

        auth_basic "Market Signal Desk";
        auth_basic_user_file C:/Users/Hada/Documents/Qoder/2026-11-05/f59e2388/market-dashboard/nginx/.htpasswd;

        location / {
            proxy_pass http://market_desk;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
